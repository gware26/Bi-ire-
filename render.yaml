# One-click deploy: https://render.com/deploy?repo=https://github.com/gware26/Bi-ire-
services:
  - type: web
    name: biire
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ADDIS_API_KEY
        sync: false
      - key: ADDIS_STT_LANG
        value: en
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3.1-flash-lite-preview,gemini-3.8-flash,gemini-3.5-flash,gemini-3.1-flash-lite
      - key: DEMO_MODE
        value: "0"
      - key: DB_PATH
        value: /app/data/lissannote.db
      - key: FRONTEND_DIST
        value: /app/frontend/dist
