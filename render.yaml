# One-click deploy: https://render.com/deploy?repo=https://github.com/gware26/Bi-ire-
services:
  - type: web
    name: biire
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ADDIS_API_KEY
        sync: false
      - key: ADDIS_STT_LANG
        value: en,am,om
      - key: DEMO_MODE
        value: "0"
      - key: DB_PATH
        value: /app/data/lissannote.db
      - key: FRONTEND_DIST
        value: /app/frontend/dist
